build:
  maxIssues: 200

style:
  MaxLineLength:
    active: true
    maxLineLength: 140
  MagicNumber:
    active: false
  ReturnCount:
    active: true
    max: 10
  LoopWithTooManyJumpStatements:
    active: true
    maxJumpCount: 5

complexity:
  active: true
  ComplexCondition:
    active: true
    threshold: 10
  CyclomaticComplexMethod:
    active: true
    threshold: 100
  LongMethod:
    active: true
    threshold: 400
  LongParameterList:
    active: true
    functionThreshold: 50
    constructorThreshold: 50
  NestedBlockDepth:
    active: true
    threshold: 20
  TooManyFunctions:
    active: true
    thresholdInFiles: 100
    thresholdInClasses: 100
    thresholdInInterfaces: 100
    thresholdInObjects: 100
    thresholdInEnums: 100
    ignoreDeprecated: false
    ignorePrivate: false
    ignoreOverridden: false
